<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h2 class="text-center">Security Survey</h2>

    <form id="surveyForm">
        <div id="surveyContainer" class="mt-4">
            <!-- ✅ Thymeleaf Loop to Render Questions -->
            <div th:each="question : ${questions}" class="mb-3">
                <label class="form-label" th:text="${question.questionText}"></label>
                <input type="text" class="form-control survey-input" th:id="'question-' + ${question.id}" placeholder="Your Answer">
            </div>
        </div>

        <button type="button" id="submitSurvey" class="btn btn-primary mt-3">Submit Survey</button>
    </form>

    <div id="responseMessage" class="mt-3"></div>

    <div id="recommendationContainer" class="mt-4 text-center" style="display: none;">
        <h4>Recommended Security Category:</h4>
        <p id="recommendationText" class="alert alert-info"></p>
    </div>

    <script>
        document.getElementById("submitSurvey").addEventListener("click", function () {
            const responses = [];
            let allAnswered = true;

            document.querySelectorAll(".survey-input").forEach(input => {
                const questionId = input.id.split("-")[1];
                const answer = input.value.trim();

                if (!answer) {
                    allAnswered = false;
                }

                responses.push({
                    question: { id: questionId },
                    response: answer
                });
            });

            if (!allAnswered) {
                alert("⚠️ Please answer all questions before submitting.");
                return;
            }

            fetch(`/survey/submit`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(responses)
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("responseMessage").innerHTML = `<div class="alert alert-success">Survey submitted successfully.</div>`;

                if (data.recommendedCategory) {
                    document.getElementById("recommendationText").textContent = data.recommendedCategory;
                    document.getElementById("recommendationContainer").style.display = "block";
                }

                setTimeout(() => {
                    window.location.href = "/questionnaire/selection";
                }, 5000);
            })
            .catch(error => {
                document.getElementById("responseMessage").innerHTML = `<div class="alert alert-danger">Error submitting survey.</div>`;
                console.error("❌ Error submitting survey:", error);
            });
        });
    </script>

</body>
</html>
