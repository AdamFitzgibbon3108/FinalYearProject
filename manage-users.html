<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users | ThreatLens</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #121212;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        h1, h2 {
            color: #ffffff;
            font-weight: bold;
        }

        /* Buttons */
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: 0.3s ease-in-out;
        }

        button:hover {
            background-color: #0056b3;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .delete-btn:hover {
            background-color: #b52a37;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #6c757d;
        }

        .back-btn:hover {
            background-color: #5a6268;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.4);
        }

        th, td {
            padding: 12px;
            text-align: left;
            color: white;
            border-bottom: 1px solid #444;
        }

        th {
            background-color: #007bff;
            text-transform: uppercase;
        }

        tbody tr:hover {
            background-color: #333;
            transition: 0.2s ease-in-out;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #1e1e1e;
            padding: 25px;
            width: 40%;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 20px;
            cursor: pointer;
            color: white;
        }

        /* Form Styling */
        input, select {
            width: 80%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(88, 166, 255, 0.15);
            color: white;
        }
    </style>
</head>
<body>

    <!-- ✅ Back Button -->
    <button class="back-btn" onclick="goBack()">← Back to Dashboard</button>

    <div class="container">
        <h1>Manage Users</h1>

        <h2>Add New User</h2>
        <form id="addUserForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <label for="roles">Select Roles:</label>
            <select id="roles" multiple>
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
            </select>
            <button type="submit">Add User</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Roles</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${#strings.listJoin(user.roles.![name], ', ')}"></td>
                    <td>
                        <button class="edit-btn"
                            th:attr="data-id=${user.id}, data-username=${user.username}, data-roles=${#strings.listJoin(user.roles.![name], ',')}">
                            Edit
                        </button>
                        <button class="delete-btn" th:attr="data-id=${user.id}">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- ✅ Edit User Modal -->
    <div id="editUserModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEditPopup()">&times;</span>
            <h2>Edit User</h2>
            <form id="editUserForm">
                <input type="hidden" id="editUserId">
                <label for="editUsername">Username:</label>
                <input type="text" id="editUsername" required>
                <label for="editRoles">Roles:</label>
                <select id="editRoles" multiple>
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
                <button type="submit">Save Changes</button>
                <button type="button" onclick="closeEditPopup()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        function goBack() {
            window.location.href = '/admin/dashboard';
        }

        // ✅ Add User
        document.getElementById('addUserForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const selectedRoles = Array.from(document.getElementById('roles').selectedOptions)
                .map(option => ({ name: option.value }));

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, roles: selectedRoles })
            }).then(response => response.ok ? location.reload() : alert("Error adding user"));
        });

        // ✅ Delete User
        document.querySelectorAll('.delete-btn').forEach(button => {
            button.addEventListener('click', function() {
                const userId = this.getAttribute('data-id');
                if (confirm("Are you sure you want to delete this user?")) {
                    fetch(`/api/users/${userId}`, { method: 'DELETE' })
                    .then(response => response.ok ? location.reload() : alert("Error deleting user"));
                }
            });
        });

        function closeEditPopup() {
            document.getElementById('editUserModal').style.display = 'none';
        }

        // ✅ Edit User & Save Changes
        document.getElementById('editUserForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const id = document.getElementById('editUserId').value;
            const username = document.getElementById('editUsername').value;
            const selectedRoles = Array.from(document.getElementById('editRoles').selectedOptions)
                .map(option => ({ name: option.value }));

            fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, roles: selectedRoles })
            }).then(response => response.ok ? location.reload() : alert("Error updating user"));
        });
    </script>

</body>
</html>
