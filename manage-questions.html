<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Questions | ThreatLens</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary-dark: #0a192f;
            --primary-medium: #172a45;
            --primary-light: #303f60;
            --accent: #64ffda;
            --text-primary: #ccd6f6;
            --text-secondary: #8892b0;
        }
        
        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            background-color: var(--primary-dark);
            color: var(--text-primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--accent);
            font-size: 2.5rem;
            border-bottom: 1px solid var(--primary-light);
            padding-bottom: 10px;
        }

        h2 {
            color: var(--accent);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .controls form {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-grow: 1;
        }

        input, select, button {
            background-color: var(--primary-medium);
            color: var(--text-primary);
            border: 1px solid var(--primary-light);
            border-radius: 4px;
            padding: 10px 15px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(100, 255, 218, 0.2);
        }

        button {
            background-color: var(--primary-light);
            color: var(--text-primary);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
        }

        button:hover {
            background-color: var(--accent);
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--primary-light);
        }

        th {
            background-color: var(--primary-medium);
            color: var(--accent);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tr:hover {
            background-color: var(--primary-medium);
        }

        .actions button {
            margin-right: 8px;
            padding: 5px 10px;
            font-size: 0.7rem;
        }

        .new-question-form {
            border-top: 1px solid var(--primary-light);
            padding-top: 30px;
            margin-top: 40px;
        }

        .new-question-form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(10, 25, 47, 0.9);
        }

        .modal-content {
            background-color: var(--primary-medium);
            margin: 10% auto;
            padding: 25px;
            border: 1px solid var(--accent);
            width: 450px;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            color: var(--accent);
            margin-top: 0;
            border-bottom: 1px solid var(--primary-light);
            padding-bottom: 10px;
        }

        .modal-content input,
        .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: var(--primary-dark);
        }

        .modal-content button {
            padding: 8px 16px;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Manage Security Questions</h1>

  
    <div class="new-question-form">
        <h2>Add New Security Question</h2>

        <!--  Error Message -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}" style="color: #ff6b6b; margin-bottom: 20px; font-weight: bold;"></div>

        <form th:action="@{/questions/add}" method="post">
            <div>
                <label>Question Text:</label>
                <input type="text" name="question_text" required>
            </div>
            <div>
                <label>Options (comma-separated):</label>
                <input type="text" name="options" required>
            </div>
            <div>
                <label>Correct Answer:</label>
                <input type="text" name="correct_answer" required>
            </div>
            <div>
                <label>Role:</label>
                <select name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="General">General</option>
                    <option value="Developer">Developer</option>
                    <option value="Manager">Manager</option>
                    <option value="Analyst">Analyst</option>
                </select>
            </div>
            <div>
                <label>Category:</label>
                <select name="category" required>
                    <option value="">-- Select Category --</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
            </div>
            <div style="margin-top: 20px;">
                <button type="submit">Add Question</button>
            </div>
        </form>
    </div>

    <!-- Search & Filter -->
    <div class="controls">
        <form th:action="@{/questions/search}" method="get">
            <input type="text" name="keyword" placeholder="Search keyword...">
            <button type="submit">Search</button>
        </form>

        <form th:action="@{/questions/filter}" method="get">
            <select name="category">
                <option value="">-- Filter by Category --</option>
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
            </select>
            <button type="submit">Filter</button>
        </form>
    </div>

    <!-- Question Table -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Question</th>
            <th>Options</th>
            <th>Category</th>
            <th>Role</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="question : ${questions}">
            <td th:text="${question.id}"></td>
            <td th:text="${question.text}"></td>
            <td th:text="${question.options}"></td>
            <td th:text="${question.category}"></td>
            <td th:text="${question.role}"></td>
            <td class="actions">
                <button type="button"
                        th:attr="data-id=${question.id},
                                 data-text=${question.text},
                                 data-options=${question.options},
                                 data-correct-answer=${question.correctAnswer},
                                 data-role=${question.role}"
                        onclick="openEditModal(this)">Edit</button>
                <form th:action="@{/questions/delete/{id}(id=${question.id})}" method="post" style="display:inline;" onsubmit="return confirm('Delete this question?')">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Modal for Editing -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>Edit Security Question</h3>
        <form id="editForm" method="post">
            <input type="hidden" id="modalId" name="id">

            <label>Question Text:</label>
            <input type="text" id="modalQuestionText" name="question_text" required>

            <label>Options:</label>
            <input type="text" id="modalOptions" name="options" required>

            <label>Correct Answer:</label>
            <input type="text" id="modalCorrectAnswer" name="correct_answer" required>

            <label>Role:</label>
            <select id="modalRole" name="role" required>
                <option value="">-- Select Role --</option>
                <option value="General">General</option>
                <option value="Developer">Developer</option>
                <option value="Manager">Manager</option>
                <option value="Analyst">Analyst</option>
            </select>

            <div style="text-align: right; margin-top: 20px;">
                <button type="submit">Save</button>
                <button type="button" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openEditModal(button) {
        const id = button.getAttribute('data-id');
        const text = button.getAttribute('data-text');
        const options = button.getAttribute('data-options');
        const correctAnswer = button.getAttribute('data-correct-answer');
        const role = button.getAttribute('data-role');

        document.getElementById('editModal').style.display = 'block';
        document.getElementById('modalId').value = id;
        document.getElementById('modalQuestionText').value = text;
        document.getElementById('modalOptions').value = options;
        document.getElementById('modalCorrectAnswer').value = correctAnswer;
        document.getElementById('modalRole').value = role;
        document.getElementById('editForm').action = `/questions/update/${id}`;
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('editModal');
        if (event.target == modal) {
            closeModal();
        }
    }
</script>
</body>
</html>
